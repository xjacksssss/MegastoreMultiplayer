name: Release

# Triggers when you push a version tag, e.g. git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # The ci-libs/ directory holds reference DLLs (game + BepInEx) committed to the
      # repo so the build can resolve all references without a local game install.
      # GameDir is intentionally left unset — CopyToPlugins is skipped automatically.
      - name: Build (Release)
        run: dotnet build MegastoreMultiplayer/MegastoreMultiplayer.csproj -c Release

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Find the previous tag so we know which commits to include.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First ever release — include everything.
            CHANGES=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          fi

          # Write to GITHUB_OUTPUT using the multiline delimiter syntax.
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: MegastoreMultiplayer/bin/Release/net472/MegastoreMultiplayer.dll
          # draft: true   ← uncomment to review before publishing
